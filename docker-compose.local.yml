services:

  # ── PostgreSQL — used by: user, posts, notifications, spheres ─────────────
  postgres:
    image: postgres:16-alpine
    container_name: collabsphere-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${dbuserId}
      POSTGRES_PASSWORD: ${dbuserpwd}
    volumes:
      - collabsphere-postgres-data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${dbuserId} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Neo4j — used by: connections-service ──────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: collabsphere-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${neoUserId}/${neoPwd}
    volumes:
      - collabsphere-neo4j-data:/data
      - collabsphere-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── MongoDB — used by: messages-service ───────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: collabsphere-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${mongoUserId:-mongouser}
      MONGO_INITDB_ROOT_PASSWORD: ${mongoUserPwd:-mongopass}
      MONGO_INITDB_DATABASE: collabsphere_messages
    volumes:
      - collabsphere-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  collabsphere-postgres-data:
  collabsphere-neo4j-data:
  collabsphere-neo4j-logs:
  collabsphere-mongodb-data:
