<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CollabSphere">
  <defs>
    <radialGradient id="cs-planet" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#F47A53"/>
      <stop offset="55%" stop-color="#E4543A"/>
      <stop offset="100%" stop-color="#C63A28"/>
    </radialGradient>
    <linearGradient id="cs-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5570F0"/>
      <stop offset="100%" stop-color="#2E45C4"/>
    </linearGradient>
    <pattern id="cs-dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <circle cx="2" cy="2" r="1.1" fill="#C9BBA0" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="cs-tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <!-- cream tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#F1E9D8"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#cs-dots)" clip-path="url(#cs-tile)"/>

  <g clip-path="url(#cs-tile)">
    <g transform="rotate(-20 256 256)">
      <!-- ring (full, behind planet) -->
      <ellipse cx="256" cy="262" rx="206" ry="66" fill="none" stroke="url(#cs-ring)" stroke-width="22"/>
      <!-- planet -->
      <circle cx="256" cy="250" r="120" fill="url(#cs-planet)"/>
      <!-- soft highlight -->
      <ellipse cx="214" cy="206" rx="46" ry="34" fill="#FFFFFF" fill-opacity="0.22"/>
      <!-- ring front arc (over planet) -->
      <path d="M 50 262 A 206 66 0 0 0 462 262" fill="none" stroke="url(#cs-ring)" stroke-width="22" stroke-linecap="round"/>
    </g>
  </g>
</svg>
