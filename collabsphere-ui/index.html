<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabSphere</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="theme-color" content="#0c0a16" />
    <meta name="description" content="CollabSphere — where ideas collide and networks grow" />
    <style>
      body { margin: 0; background: #0c0a16; }
    </style>
    <!-- Prevent FOUC: set theme before React mounts -->
    <script>
      (function () {
        var t = localStorage.getItem('cs-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
