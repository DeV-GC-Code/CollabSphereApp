spring.application.name=posts-service

server.port=9010
server.servlet.context-path=/posts

# ARC-3: per-service database (was the shared `postgres` DB). Created by scripts/db-init.
spring.datasource.url=jdbc:postgresql://localhost:5432/collabsphere_posts?useSSL=false
spring.datasource.username=${dbuserId}
spring.datasource.password=${dbuserpwd}

# ARC-3: the post seed needs to resolve user IDs by email, but the `users` table
# now lives in collabsphere_users (DB-per-service). This read-only lookup datasource
# lets DataInitializer reach it without re-coupling the two services' schemas.
users.datasource.url=jdbc:postgresql://localhost:5432/collabsphere_users?useSSL=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secretKey=${secret}
connections-service.url=http://localhost:9030

# ARC-2: enable Feign + Spring Cloud CircuitBreaker (resilience4j) so the
# connections call has a fallback. Time-limiter caps slow calls.
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.instances.connections-service.timeout-duration=3s
resilience4j.circuitbreaker.instances.connections-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.connections-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.connections-service.wait-duration-in-open-state=10s
