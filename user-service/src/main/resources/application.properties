spring.application.name=user-service

server.port = 9020

jwt.secretKey = ${secret}
# SEC-4: access-token lifetime (ms). Default 24h. Lower for prod + add refresh tokens.
jwt.accessTokenExpirationMs = ${JWT_ACCESS_TTL_MS:86400000}

# Seed password is read from SEED_DEFAULT_PASSWORD env var — blank = no seeding
seed.default-password = ${SEED_DEFAULT_PASSWORD:}
# ARC-3: per-service database (was the shared `postgres` DB). Created by scripts/db-init.
spring.datasource.url=jdbc:postgresql://localhost:5432/collabsphere_users?useSSL=false
spring.datasource.username=${dbuserId}
spring.datasource.password=${dbuserpwd}

server.servlet.context-path=/users
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
