spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "${CORS_ALLOWED_ORIGIN:}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            maxAge: 3600
      routes:
        # ── user-service: only auth (signup/login) + stats are PUBLIC.
        #    Everything else (directory, profile-by-id) requires a valid JWT.
        #    Route order matters: first match wins, so public routes precede the catch-all.
        - id: user-auth
          uri: http://localhost:9020
          predicates:
            - Path=/api/v1/users/auth/**
          filters:
            - StripPrefix=2
            - name: RateLimit          # SEC-2: throttle login/signup (brute-force / spam)
        - id: user-stats
          uri: http://localhost:9020
          predicates:
            - Path=/api/v1/users/stats
          filters:
            - StripPrefix=2
        - id: user-service             # SEC-1: protected reads (list, by-id)
          uri: http://localhost:9020
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: posts-service
          uri: http://localhost:9010
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: connections-service
          uri: http://localhost:9030
          predicates:
            - Path=/api/v1/connections/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: likes-service
          uri: http://localhost:9010
          predicates:
            - Path=/api/v1/likes/**
          filters:
            - RewritePath=/api/v1/likes/(?<segment>.*), /posts/likes/$\{segment}
            - name: AuthenticationFilter

        - id: spheres-service
          uri: http://localhost:8009
          predicates:
            - Path=/api/v1/spheres/**
          filters:
            - StripPrefix=3
            - name: AuthenticationFilter

        - id: messages-service
          uri: http://localhost:8010
          predicates:
            - Path=/api/v1/messages/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: notification-service
          uri: http://localhost:9070
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

jwt.secretKey: ${secret}
server:
  port: 8007
