spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2

        - id: posts-service
          uri: lb://POSTS-SERVICE
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: connections-service
          uri: lb://CONNECTIONS-SERVICE
          predicates:
            - Path=/api/v1/connections/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: likes-service
          uri: lb://POSTS-SERVICE
          predicates:
            - Path=/api/v1/likes/**
          filters:
            - RewritePath=/api/v1/likes/(?<segment>.*), /posts/likes/$\{segment}
            - name: AuthenticationFilter

        - id: spheres-service
          uri: lb://SPHERES-SERVICE
          predicates:
            - Path=/api/v1/spheres/**
          filters:
            - StripPrefix=3
            - name: AuthenticationFilter

        - id: messages-service
          uri: lb://MESSAGES-SERVICE
          predicates:
            - Path=/api/v1/messages/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

jwt.secretKey: ${secret}
server:
  port: 8007

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
